name: focuspet
description: A gamified focus timer MVP with a study buddy, XP, coins, streaks, quests, stats, and a shop.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^21.0.0
  flutter_timezone: ^5.0.2
  shared_preferences: ^2.5.5
  timezone: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
